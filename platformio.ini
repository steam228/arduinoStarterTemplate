; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Which environment(s) build/upload when you press the PlatformIO buttons.
; The classic Arduino UNO is the default for this template.
[platformio]
default_envs = uno

; Classic Arduino UNO (ATmega328P) - the default board
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Optional: Arduino UNO R4 WiFi
; Build it with:  pio run -e uno_r4_wifi
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 9600
